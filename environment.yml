name: piml-geopolymer

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip>=24
  - setuptools
  - wheel
  - numpy>=1.26,<2.3
  - pandas>=2.2,<3
  - scipy>=1.12,<2
  - scikit-learn>=1.5,<2
  - matplotlib>=3.8,<4
  - seaborn>=0.13,<1
  - openpyxl>=3.1,<4
  - joblib>=1.4,<2
  - jupyterlab>=4,<5
  - ipykernel>=6.29,<7
  # OpenMP runtime used by XGBoost on macOS.
  - llvm-openmp
  - pip:
      - xgboost>=2.1,<4
      - optuna>=4,<5
      - shap>=0.46,<1
      - customtkinter>=5.2,<6
      - pillow>=10,<13
      - pyinstaller>=6.10,<7

