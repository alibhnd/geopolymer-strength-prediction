name: geopolymer-piml

# Reproducible environment for the geopolymer PIML analysis notebook and GUI.
# Create with:  conda env create -f environment.yml
# Activate with: conda activate geopolymer-piml

channels:
  - conda-forge

dependencies:
  # Core runtime
  - python=3.12
  - pip

  # Numerical analysis and data handling
  - numpy>=1.26,<3
  - pandas>=2.2,<4
  - scipy>=1.12,<2
  - scikit-learn>=1.5,<2
  - statsmodels>=0.14,<1
  - openpyxl>=3.1,<4
  - xlsxwriter>=3.2,<4
  - joblib>=1.4,<2

  # Modeling, optimization, and interpretation
  - xgboost>=2.1,<5
  - optuna>=4,<5
  - shap>=0.46,<1

  # Plotting
  - matplotlib>=3.8,<4
  - seaborn>=0.13,<1
  - pillow>=10,<13

  # Notebook support
  - jupyterlab>=4,<5
  - notebook>=7,<8
  - ipykernel>=6,<8
  - ipywidgets>=8,<9

  # Utilities and application packaging
  - tqdm>=4.66,<5
  - pyinstaller>=6,<7

  # CustomTkinter is installed through pip.
  - pip:
      - customtkinter>=5.2,<6
